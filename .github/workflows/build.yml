name: Build

on: [push, pull_request]

env:
  GO_VERSION: "1.21"
  OBS_VERSION: "32.2.1"

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install OBS
        run: |
          sudo add-apt-repository ppa:obsproject/obs-studio
          sudo apt update
          sudo apt install -y obs-studio
      - name: Build
        run: |
          cp /lib/x86_64-linux-gnu/libobs.so.0 ./libobs.so
          go build -buildmode=c-shared -o obs-studio-exporter.so
      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-studio-exporter-linux
          path: obs-studio-exporter.so

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install OBS
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://cdn-fastly.obsproject.com/downloads/OBS-Studio-${{ env.OBS_VERSION }}-Full-Installer-x64.exe" -OutFile obs-studio-installer.exe
          .\obs-studio-installer.exe /S | Out-Null
      - name: Build
        shell: pwsh
        run: |
          Copy-Item "C:\Program Files\obs-studio\bin\64bit\obs.dll" -Destination "."
          go build -buildmode=c-shared -o obs-studio-exporter.dll
      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-studio-exporter-windows
          path: obs-studio-exporter.dll

  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: intel
            download_suffix: Intel
            dmg_name: obs-macos-intel.dmg
          - runner: macos-14
            arch: arm64
            download_suffix: Apple
            dmg_name: obs-macos-arm64.dmg
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install OBS
        run: |
          curl -L -o "${{ matrix.dmg_name }}" "https://cdn-fastly.obsproject.com/downloads/OBS-Studio-${{ env.OBS_VERSION }}-macOS-${{ matrix.download_suffix }}.dmg"
          hdiutil attach "./${{ matrix.dmg_name }}"
      - name: Build
        run: |
          cp -R /Volumes/OBS*/OBS.app/Contents/Frameworks/libobs.framework ./libobs.framework
          go build -buildmode=c-shared -o obs-studio-exporter.so -ldflags="-extldflags=-F$PWD"
      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-studio-exporter-macos-${{ matrix.arch }}
          path: obs-studio-exporter.so
