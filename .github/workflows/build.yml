name: Build

on: [push, pull_request]

env:
  GO_VERSION: "1.21"
  OBS_VERSION: "32.2.1"

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install OBS
        run: |
          sudo add-apt-repository ppa:obsproject/obs-studio
          sudo apt update
          sudo apt install -y obs-studio
      - name: Build
        run: |
          cp /lib/x86_64-linux-gnu/libobs.so.0 ./libobs.so
          go build -buildmode=c-shared -o obs-studio-exporter.so
      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-studio-exporter-linux
          path: obs-studio-exporter.so

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install OBS
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://cdn-fastly.obsproject.com/downloads/OBS-Studio-${{ env.OBS_VERSION }}-Windows-x64-Installer.exe" -OutFile obs-studio-installer.exe
          .\obs-studio-installer.exe /S | Out-Null
      - name: Build
        shell: pwsh
        run: |
          Copy-Item "C:\Program Files\obs-studio\bin\64bit\obs.dll" -Destination "."
          go build -buildmode=c-shared -o obs-studio-exporter.dll
      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-studio-exporter-windows
          path: obs-studio-exporter.dll

  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: intel
            download_suffix: Intel
            dmg_name: obs-macos-intel.dmg
          - runner: macos-14
            arch: arm64
            download_suffix: Apple
            dmg_name: obs-macos-arm64.dmg
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install OBS
        run: |
          curl -L -o "${{ matrix.dmg_name }}" "https://cdn-fastly.obsproject.com/downloads/OBS-Studio-${{ env.OBS_VERSION }}-macOS-${{ matrix.download_suffix }}.dmg"
          hdiutil attach "./${{ matrix.dmg_name }}"
      - name: Build
        run: |
          cp -R /Volumes/OBS*/OBS.app/Contents/Frameworks/libobs.framework ./libobs.framework
          go build -buildmode=c-shared -o obs-studio-exporter.so -ldflags="-extldflags=-F$PWD"
      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-studio-exporter-macos-${{ matrix.arch }}
          path: obs-studio-exporter.so

  release:
    name: Release
    runs-on: ubuntu-22.04
    needs:
      - build-linux
      - build-windows
      - build-macos
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: obs-studio-exporter-linux
          path: dist/linux
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: obs-studio-exporter-windows
          path: dist/windows
      - name: Download macOS Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: obs-studio-exporter-macos-intel
          path: dist/macos-intel
      - name: Download macOS ARM artifact
        uses: actions/download-artifact@v4
        with:
          name: obs-studio-exporter-macos-arm64
          path: dist/macos-arm64
      - name: Package artifacts
        run: |
          mkdir -p release
          cp dist/linux/obs-studio-exporter.so release/obs-studio-exporter-linux.so
          cp dist/windows/obs-studio-exporter.dll release/obs-studio-exporter-windows.dll
          cp dist/macos-intel/obs-studio-exporter.so release/obs-studio-exporter-macos-intel.so
          cp dist/macos-arm64/obs-studio-exporter.so release/obs-studio-exporter-macos-arm64.so
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_number }}
          name: Nightly ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: release/*
